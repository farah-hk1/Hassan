<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تشكيلة نادي الاتحاد</title>
<style>
  :root{
    --pitch-1:#2e7d46;
    --pitch-2:#276e3d;
    --line:rgba(255,255,255,.85);
    --yellow:#f7c500;
    --black:#111111;
    --chip-bg:rgba(255,255,255,.94);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:linear-gradient(180deg,#fff8d7 0%,#f8f5ea 58%,#eef7ee 100%);
    color:#111;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 10px 40px;
    -webkit-tap-highlight-color:transparent;
  }


  body.lang-en{
    direction:ltr;
  }
  body.lang-en .top,
  body.lang-en .toolbar{
    direction:ltr;
  }
  body.lang-ar{
    direction:rtl;
  }
  body.lang-ar .top,
  body.lang-ar .toolbar{
    direction:rtl;
  }
  body.lang-ar .chip{
    direction:rtl;
    text-transform:none;
    letter-spacing:0;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  }
  body.lang-en .chip{
    direction:ltr;
    text-transform:uppercase;
    letter-spacing:.3px;
  }

  /* ===== الهيدر ===== */

  .logo-img,
  .header-logo-img{
    width:74px;
    height:auto;
    display:block;
    object-fit:contain;
  }
  .top .logo-img{
    width:70px;
    flex-shrink:0;
  }
  .header-logo-img{
    margin:0 auto 8px;
  }
  .pitch-logo-img{
    position:absolute;
    top:50%;
    left:50%;
    width:23%;
    height:auto;
    transform:translate(-50%,-50%);
    opacity:.18;
    z-index:1;
    pointer-events:none;
  }

  .top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .badge{width:56px;height:auto;flex-shrink:0}
  .top h1{font-size:1.25rem;color:var(--black)}
  .top p{font-size:.78rem;color:#5f6f61;margin-top:2px}

  /* ===== شريط الأدوات ===== */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
    margin-bottom:12px;
    width:min(720px,96vw);
  }
  .toolbar input[type="text"]{
    flex:1;
    min-width:140px;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid #d8d1b8;
    background:#fff;
    color:#111;
    font-size:.9rem;
    font-family:inherit;
  }
  .toolbar input[type="text"]::placeholder{color:#8a8374}
  .toolbar input[type="file"]{display:none}
  .btn-image{
    background:#fff;
    color:#111;
    border:1px solid #d8d1b8;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .image-file-name{
    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:.72rem;
    color:#6c6557;
  }
  .btn{
    padding:9px 16px;
    border-radius:8px;
    border:none;
    font-family:inherit;
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.96)}
  .btn-add{background:var(--yellow);color:var(--black)}
  .btn-gk{background:#ff8b3d;color:var(--black)}
  .btn-print{background:#fff;color:var(--black)}
  .btn-toggle{background:#fff;color:#8b1e1e;border:1px solid #d7bcbc}
  .btn-toggle.on{background:#8b1e1e;color:#fff;border-color:#8b1e1e}
  .print-options{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:7px 10px;
    background:rgba(255,255,255,.92);
    border:1px solid #d8d1b8;
    border-radius:10px;
  }
  .print-options-title{
    font-size:.78rem;
    font-weight:800;
    color:#111;
    white-space:nowrap;
  }
  .print-option-check{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:.76rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .print-option-check input{
    width:16px;
    height:16px;
    accent-color:var(--yellow);
    cursor:pointer;
  }
  .print-style-wrap{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:.76rem;
    font-weight:700;
    white-space:nowrap;
  }
  .print-style-select{
    padding:6px 8px;
    border:1px solid #d8d1b8;
    border-radius:7px;
    background:#fff;
    color:#111;
    font-family:inherit;
    font-size:.76rem;
    font-weight:700;
    cursor:pointer;
  }
  .hint{
    width:min(720px,96vw);
    text-align:center;
    font-size:.72rem;
    color:#5f6f61;
    margin-bottom:10px;
  }

  /* ===== الملعب ===== */
  .print-header{display:none}
  .pitch{
    position:relative;
    width:min(720px,96vw);
    aspect-ratio:380/600;
    border:5px solid var(--line);
    border-radius:4px;
    background:#2e7d32;
    background-image:linear-gradient(to bottom,
      #2e7d32 10%,#388e3c 10%,#388e3c 20%,
      #2e7d32 20%,#2e7d32 30%,#388e3c 30%,#388e3c 40%,
      #2e7d32 40%,#2e7d32 50%,#388e3c 50%,#388e3c 60%,
      #2e7d32 60%,#2e7d32 70%,#388e3c 70%,#388e3c 80%,
      #2e7d32 80%,#2e7d32 90%,#388e3c 90%,#388e3c 100%);
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    touch-action:none;
  }

  .pitch-logo{
    position:absolute;
    top:50%;
    left:50%;
    width:23%;
    aspect-ratio:74/86;
    transform:translate(-50%,-50%);
    opacity:.18;
    z-index:1;
    pointer-events:none;
  }

  .halfway{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:3px;
    background:var(--line);
    transform:translateY(-50%);
  }

  .center-circle{
    position:absolute;
    top:50%;
    left:50%;
    width:26%;
    aspect-ratio:1;
    border:3px solid var(--line);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }

  .center-dot,
  .penalty-spot{
    position:absolute;
    width:7px;
    height:7px;
    background:var(--line);
    border-radius:50%;
  }

  .center-dot{
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
  }

  .penalty-spot{
    left:50%;
    transform:translateX(-50%);
  }

  .penalty-spot.top{top:10.8%}
  .penalty-spot.bottom{bottom:10.8%}

  .penalty-area,
  .goal-area,
  .penalty-arc,
  .goal-mouth,
  .corner-arc{
    position:absolute;
    border-color:var(--line);
  }

  .penalty-area{
    left:50%;
    width:58%;
    height:15%;
    border:3px solid var(--line);
    transform:translateX(-50%);
  }

  .penalty-area.top{top:0;border-top:none}
  .penalty-area.bottom{bottom:0;border-bottom:none}

  .goal-area{
    left:50%;
    width:29%;
    height:5.8%;
    border:3px solid var(--line);
    transform:translateX(-50%);
  }

  .goal-area.top{top:0;border-top:none}
  .goal-area.bottom{bottom:0;border-bottom:none}

  .penalty-arc{
    left:50%;
    width:21%;
    height:6.7%;
    border:3px solid var(--line);
    transform:translateX(-50%);
  }

  .penalty-arc.top{top:15%;border-top:none;border-radius:0 0 80px 80px}
  .penalty-arc.bottom{bottom:15%;border-bottom:none;border-radius:80px 80px 0 0}

  .goal-mouth{
    left:50%;
    width:17%;
    height:2%;
    background:rgba(255,255,255,.18);
    border:2px solid var(--line);
    transform:translateX(-50%);
  }

  .goal-mouth.top{top:-17px;border-bottom:none}
  .goal-mouth.bottom{bottom:-17px;border-top:none}

  .corner-arc{
    width:15px;
    height:15px;
    border:3px solid var(--line);
  }

  .corner-top-left{top:-3px;left:-3px;border-radius:0 0 15px 0;border-top:none;border-left:none}
  .corner-top-right{top:-3px;right:-3px;border-radius:0 0 0 15px;border-top:none;border-right:none}
  .corner-bottom-left{bottom:-3px;left:-3px;border-radius:0 15px 0 0;border-bottom:none;border-left:none}
  .corner-bottom-right{bottom:-3px;right:-3px;border-radius:15px 0 0 0;border-bottom:none;border-right:none}

  /* ===== اللاعب مع الصورة ===== */
  .chip{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    gap:4px;
    max-width:118px;
    min-height:34px;
    background:var(--chip-bg);
    color:#111;
    border:1.5px solid var(--yellow);
    border-radius:999px;
    padding:2px 7px 2px 2px;
    cursor:grab;
    user-select:none;
    touch-action:none;
    box-shadow:0 2px 7px rgba(0,0,0,.42);
    z-index:5;
  }
  body.lang-ar .chip{padding:2px 2px 2px 7px}
  .chip.gk{border-color:#ff8b3d}
  .player-photo{
    width:29px;
    height:29px;
    flex:0 0 29px;
    border-radius:50%;
    object-fit:cover;
    object-position:center top;
    background:#ececec;
    border:1.5px solid var(--yellow);
    pointer-events:none;
  }
  .chip.gk .player-photo{border-color:#ff8b3d}
  .player-name{
    display:block;
    min-width:0;
    max-width:80px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:.55rem;
    font-weight:800;
    line-height:1.05;
    text-align:center;
    pointer-events:none;
  }
  body.lang-en .player-name{
    direction:ltr;
    text-transform:uppercase;
    letter-spacing:.2px;
  }
  body.lang-ar .player-name{
    direction:rtl;
    text-transform:none;
    letter-spacing:0;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  }
  .chip.dragging{
    cursor:grabbing;
    z-index:50;
    box-shadow:0 8px 20px rgba(0,0,0,.6);
    border-color:#fff;
  }
  body.delete-mode .chip{border-color:#e05252;animation:shake .5s infinite}
  body.delete-mode .chip .player-photo{border-color:#e05252}
  body.delete-mode .chip::after{
    content:"✕";
    position:absolute;
    top:-7px;
    left:-7px;
    width:15px;height:15px;
    background:#e05252;
    color:#fff;
    border-radius:50%;
    font-size:.55rem;
    display:flex;align-items:center;justify-content:center;
  }
  @keyframes shake{
    0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
    25%{transform:translate(-50%,-50%) rotate(-1.5deg)}
    75%{transform:translate(-50%,-50%) rotate(1.5deg)}
  }
  @media (max-width:480px){
    .chip{
      gap:2px;
      max-width:78px;
      min-height:25px;
      padding:1px 4px 1px 1px;
      border-width:1px;
    }
    body.lang-ar .chip{padding:1px 1px 1px 4px}
    .player-photo{width:22px;height:22px;flex-basis:22px;border-width:1px}
    .player-name{max-width:50px;font-size:.39rem}
  }



  /* ===== التخطيط الجانبي ===== */
  .main-layout{
    display:flex;
    align-items:flex-start;
    gap:16px;
    width:min(1080px,96vw);
  }
  .squad-sidebar{
    width:min(300px,32vw);
    min-width:240px;
    max-height:600px;
    background:rgba(255,255,255,.9);
    border:1px solid #e5dcc4;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
    overflow:hidden;
    backdrop-filter:blur(4px);
  }
  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:12px 14px;
    background:linear-gradient(180deg,#fff7cf 0%,#fff 100%);
    border-bottom:1px solid #eee1bd;
  }
  .sidebar-head h3{
    margin:0;
    font-size:1rem;
    color:#111;
  }
  .sidebar-count{
    flex-shrink:0;
    min-width:34px;
    height:26px;
    padding:0 9px;
    border-radius:999px;
    background:var(--yellow);
    color:#111;
    font-size:.82rem;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sidebar-list{
    max-height:534px;
    overflow:auto;
    padding:10px;
  }
  .sidebar-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border-radius:10px;
    background:#fff;
    border:1px solid #f1ead8;
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .sidebar-item:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(0,0,0,.08);
    border-color:#e2c95f;
  }
  .sidebar-photo{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    object-position:center top;
    background:#ececec;
    border:2px solid var(--yellow);
    flex:0 0 42px;
  }
  .sidebar-item.gk .sidebar-photo{border-color:#ff8b3d}
  .sidebar-name{
    min-width:0;
    font-size:.84rem;
    font-weight:700;
    line-height:1.3;
    color:#111;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sidebar-info{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .sidebar-status{
    font-size:.66rem;
    color:#7b7465;
  }
  .sidebar-action{
    flex-shrink:0;
    min-width:68px;
    border:none;
    border-radius:8px;
    padding:7px 8px;
    font-family:inherit;
    font-size:.7rem;
    font-weight:800;
    cursor:pointer;
    background:var(--yellow);
    color:#111;
  }
  .sidebar-action:hover{filter:brightness(.96)}
  .sidebar-action.added{
    background:#eef4ee;
    color:#2f6b3f;
    cursor:default;
    border:1px solid #cfe0d1;
  }
  .sidebar-actions{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:5px;
    align-items:stretch;
  }
  .sidebar-photo-action{
    min-width:68px;
    border:1px solid #d9d0b8;
    border-radius:8px;
    padding:6px 7px;
    font-family:inherit;
    font-size:.66rem;
    font-weight:800;
    cursor:pointer;
    background:#fff;
    color:#333;
  }
  .sidebar-photo-action:hover{
    border-color:#111;
    background:#fff9df;
  }
  .sidebar-item.active{
    border-color:#111;
    box-shadow:0 0 0 2px rgba(17,17,17,.08);
  }
  body.lang-en .sidebar-name,
  body.lang-en .sidebar-head{
    direction:ltr;
    text-transform:uppercase;
    letter-spacing:.2px;
  }
  body.lang-ar .sidebar-name,
  body.lang-ar .sidebar-head{
    direction:rtl;
    text-transform:none;
    letter-spacing:0;
  }
  @media (max-width:900px){
    .main-layout{
      flex-direction:column;
      width:min(720px,96vw);
    }
    .squad-sidebar,
    .pitch{
      width:100%;
      max-width:none;
    }
    .squad-sidebar{
      min-width:0;
      max-height:none;
    }
    .sidebar-list{max-height:320px}
  }

 /* ===== الطباعة ===== */
@media print{
  @page{size:A4 portrait;margin:5mm}

  html,
  body{
    display:block !important;
    width:100% !important;
    height:auto !important;
    min-height:0 !important;
    overflow:visible !important;
    background:#fff !important;
    background-image:none !important;
    color:#111;
    margin:0 !important;
    padding:0 !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .top h1,
  header h1,
  .print-header h1,
  .print-header h2{
    display:none !important;
  }

  .top p,
  header p,
  .print-header p,
  .hint,
  .toolbar,
  .squad-sidebar{
    display:none !important;
  }

  .main-layout{display:block !important;width:100% !important;height:auto !important;margin:0 !important;padding:0 !important;}

  .pitch{
    --line:#111;
    width:145mm !important;
    max-width:100% !important;
    margin:0 auto !important;
    break-inside:avoid-page !important;
    background:#fff !important;
    background-image:none !important;
    border:2px solid #111 !important;
    box-shadow:none !important;
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .halfway{
    background:#111 !important;
    height:1.2px;
  }

  .center-circle,
  .penalty-area,
  .goal-area,
  .penalty-arc,
  .corner-arc{
    border-color:#111 !important;
    border-width:1.2px;
  }

  .center-dot,
  .penalty-spot{
    background:#111 !important;
  }

  .goal-mouth{
    background:#fff !important;
    border-color:#111 !important;
    border-width:1px;
  }

  .goal-mouth.top{
    top:-5mm;
  }

  .goal-mouth.bottom{
    bottom:-5mm;
  }

  .chip{
    background:#fff !important;
    color:#111 !important;
    border-color:#111 !important;
    box-shadow:none !important;
    padding:.35mm 1.2mm .35mm .35mm !important;
    min-height:8.5mm;
    max-width:31mm;
    gap:.8mm;
  }

  body.lang-ar .chip{
    padding:.35mm .35mm .35mm 1.2mm !important;
  }

  .chip.gk{
    border-color:#111 !important;
  }

  .player-photo{
    width:7.2mm;
    height:7.2mm;
    flex-basis:7.2mm;
    border:.35mm solid #111 !important;
    box-shadow:none !important;
  }

  .player-name{
    max-width:21mm;
    font-size:6.2pt;
    line-height:1;
  }

  .pitch-logo,
  .pitch-logo-img{
    display:none !important;
  }

  body.delete-mode .chip{
    animation:none !important;
  }

  body.delete-mode .chip::after{
    display:none !important;
  }


  /* خيارات محتوى الطباعة */
  body.print-hide-names .player-name{
    display:none !important;
  }

  body.print-hide-images .player-photo{
    display:none !important;
  }

  body.print-hide-images .chip{
    min-height:0 !important;
    padding:1mm 1.8mm !important;
    gap:0 !important;
  }

  body.print-hide-names .chip{
    min-width:0 !important;
    max-width:9mm !important;
    padding:.35mm !important;
    justify-content:center !important;
    gap:0 !important;
  }

  body.print-hide-names.print-hide-images .chip{
    display:none !important;
  }

  /* طباعة الملعب بالألوان */
  body.print-green .pitch{
    --line:#fff;
    background:#2e7d32 !important;
    background-image:linear-gradient(to bottom,
      #2e7d32 10%,#388e3c 10%,#388e3c 20%,
      #2e7d32 20%,#2e7d32 30%,#388e3c 30%,#388e3c 40%,
      #2e7d32 40%,#2e7d32 50%,#388e3c 50%,#388e3c 60%,
      #2e7d32 60%,#2e7d32 70%,#388e3c 70%,#388e3c 80%,
      #2e7d32 80%,#2e7d32 90%,#388e3c 90%,#388e3c 100%) !important;
    border-color:#fff !important;
  }

  body.print-green .halfway{
    background:#fff !important;
  }

  body.print-green .center-circle,
  body.print-green .penalty-area,
  body.print-green .goal-area,
  body.print-green .penalty-arc,
  body.print-green .corner-arc{
    border-color:#fff !important;
  }

  body.print-green .center-dot,
  body.print-green .penalty-spot{
    background:#fff !important;
  }

  body.print-green .goal-mouth{
    background:rgba(255,255,255,.12) !important;
    border-color:#fff !important;
  }

  body.print-green .chip{
    background:rgba(255,255,255,.96) !important;
    color:#111 !important;
    border-color:#f7c500 !important;
  }

  body.print-green .chip.gk{
    border-color:#ff8b3d !important;
  }

  body.print-green .player-photo{
    border-color:#f7c500 !important;
  }

  body.print-green .chip.gk .player-photo{
    border-color:#ff8b3d !important;
  }

}
</style>
</head>

  // ===== التشكيلة الافتراضية الظاهرة عند فتح الموقع =====

  const squadRoster = initialPlayers.map((player, index) => ({
    id: `player-${index + 1}`,
    en: player.n,
    ar: arabicNames[player.n] || player.n,
    image: player.img || '',
    isGk: !!player.gk,
    x: player.x,
    y: player.y
  }));

  function getRosterPlayer(rosterId){
    return squadRoster.find(player => player.id === rosterId);
  }

  function getChipByRosterId(rosterId){
    return [...pitch.querySelectorAll('.chip')].find(chip => chip.dataset.rosterId === rosterId);
  }

  function addRosterPlayerToPitch(player){
    const existingChip = getChipByRosterId(player.id);
    if (existingChip){
      existingChip.classList.add('dragging');
      setTimeout(() => existingChip.classList.remove('dragging'), 700);
      return existingChip;
    }
    const chip = createChip(
      player.en,
      Number.isFinite(player.x) ? player.x : 50,
      Number.isFinite(player.y) ? player.y : (player.isGk ? 9 : 50),
      !!player.isGk,
      player.image || '',
      player.id,
      player.ar
    );
    chip.classList.add('dragging');
    setTimeout(() => chip.classList.remove('dragging'), 700);
    return chip;
  }

  // ===== صورة بديلة مرتبطة باسم اللاعب (لا تعرض وجه لاعب آخر) =====
  function escapeSvgText(value){
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function makeFallbackAvatar(playerName){
    const fullName = String(playerName || 'PLAYER').trim();
    const parts = fullName.split(/\s+/).filter(Boolean);
    const initials = parts.slice(0, 2).map(part => part.charAt(0)).join('') || '؟';
    const label = fullName.length > 12 ? fullName.slice(0, 12) : fullName;
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
        <rect width="200" height="200" fill="#f5c400"/>
        <circle cx="100" cy="74" r="42" fill="#202020"/>
        <path d="M30 190c4-50 32-78 70-78s66 28 70 78" fill="#202020"/>
        <circle cx="100" cy="72" r="25" fill="#f5c400"/>
        <text x="100" y="83" text-anchor="middle" font-size="31" font-family="Arial, Tahoma, sans-serif" font-weight="800" fill="#111">${escapeSvgText(initials)}</text>
        <rect x="10" y="158" width="180" height="32" rx="12" fill="#111" opacity=".94"/>
        <text x="100" y="181" text-anchor="middle" font-size="19" font-family="Arial, Tahoma, sans-serif" font-weight="700" fill="#fff">${escapeSvgText(label)}</text>
      </svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function renderSidebar(){
    if (!sidebarList) return;
    const addedCount = squadRoster.filter(player => !!getChipByRosterId(player.id)).length;
    sidebarList.innerHTML = '';
    if (sidebarCount) sidebarCount.textContent = `${addedCount}/${squadRoster.length}`;

    squadRoster.forEach(player => {
      const chip = getChipByRosterId(player.id);
      const isAdded = !!chip;
      const shownName = currentLanguage === 'ar' ? player.ar : player.en;

      const item = document.createElement('div');
      item.className = 'sidebar-item' + (player.isGk ? ' gk' : '');
      item.dataset.rosterId = player.id;

      const photo = document.createElement('img');
      photo.className = 'sidebar-photo';
      photo.src = player.image || makeFallbackAvatar(shownName);
      photo.alt = shownName;
      photo.loading = 'lazy';
      photo.referrerPolicy = 'no-referrer';
      photo.addEventListener('error', () => {
        photo.onerror = null;
        photo.src = makeFallbackAvatar(shownName);
      }, {once:true});

      const info = document.createElement('div');
      info.className = 'sidebar-info';

      const label = document.createElement('span');
      label.className = 'sidebar-name';
      label.textContent = shownName;

      const status = document.createElement('span');
      status.className = 'sidebar-status';
      status.textContent = isAdded ? uiText[currentLanguage].onPitch : uiText[currentLanguage].offPitch;
      info.append(label, status);

      const actions = document.createElement('div');
      actions.className = 'sidebar-actions';

      const action = document.createElement('button');
      action.type = 'button';
      action.className = 'sidebar-action' + (isAdded ? ' added' : '');
      action.textContent = isAdded ? uiText[currentLanguage].alreadyAdded : uiText[currentLanguage].addFromList;
      action.disabled = isAdded;
      action.addEventListener('click', event => {
        event.stopPropagation();
        if (!isAdded) addRosterPlayerToPitch(player);
      });

      const photoAction = document.createElement('button');
      photoAction.type = 'button';
      photoAction.className = 'sidebar-photo-action';
      photoAction.textContent = uiText[currentLanguage].updatePhoto;
      photoAction.addEventListener('click', event => {
        event.stopPropagation();
        pendingPhotoPlayerId = player.id;
        if (updatePlayerImageInput){
          updatePlayerImageInput.value = '';
          updatePlayerImageInput.click();
        }
      });

      actions.append(action, photoAction);
      item.append(photo, info, actions);
      item.addEventListener('click', () => {
        const currentChip = getChipByRosterId(player.id);
        if (!currentChip) return;
        document.querySelectorAll('.sidebar-item.active').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        currentChip.classList.add('dragging');
        currentChip.scrollIntoView({block:'nearest', inline:'nearest'});
        setTimeout(() => currentChip.classList.remove('dragging'), 900);
      });

      sidebarList.appendChild(item);
    });
  }

  // ===== إنشاء لاعب =====
  function createChip(name, x, y, isGk, imageUrl, rosterId, arabicName){
    const chip = document.createElement('div');
    chip.className = 'chip' + (isGk ? ' gk' : '');
    chip.dataset.en = name;
    chip.dataset.ar = arabicName || arabicNames[name] || name;
    chip.dataset.image = imageUrl || '';
    chip.dataset.rosterId = rosterId || '';
    chip.style.left = x + '%';
    chip.style.top = y + '%';
    chip.setAttribute('dir', currentLanguage === 'ar' ? 'rtl' : 'ltr');
    chip.title = currentLanguage === 'ar' ? chip.dataset.ar : chip.dataset.en;

    const photo = document.createElement('img');
    photo.className = 'player-photo';
    const shownPlayerName = currentLanguage === 'ar' ? chip.dataset.ar : chip.dataset.en;
    photo.src = imageUrl || makeFallbackAvatar(shownPlayerName);
    photo.alt = shownPlayerName;
    photo.loading = 'eager';
    photo.draggable = false;
    photo.referrerPolicy = 'no-referrer';
    if (!imageUrl) chip.classList.add('no-photo');
    photo.addEventListener('error', () => {
      photo.onerror = null;
      chip.classList.add('no-photo');
      photo.src = makeFallbackAvatar(currentLanguage === 'ar' ? chip.dataset.ar : chip.dataset.en);
    }, {once:true});

    const label = document.createElement('span');
    label.className = 'player-name';
    label.textContent = currentLanguage === 'ar' ? chip.dataset.ar : chip.dataset.en;

    chip.append(photo, label);
    enableDrag(chip);
    chip.addEventListener('click', () => {
      if (deleteMode) {
        chip.remove();
        renderSidebar();
      }
    });
    chip.addEventListener('dblclick', () => {
      if (deleteMode) return;
      const currentLabel = chip.querySelector('.player-name');
      const newName = prompt(uiText[currentLanguage].promptEdit, currentLabel.textContent);
      if (newName && newName.trim()) {
        const cleanName = newName.trim();
        if (currentLanguage === 'ar') {
          chip.dataset.ar = cleanName;
        } else {
          const upperName = cleanName.toUpperCase();
          chip.dataset.en = upperName;
          chip.dataset.ar = arabicNames[upperName] || chip.dataset.ar || upperName;
        }
        const rosterPlayer = getRosterPlayer(chip.dataset.rosterId);
        if (rosterPlayer){
          rosterPlayer.en = chip.dataset.en;
          rosterPlayer.ar = chip.dataset.ar;
        }
        currentLabel.textContent = currentLanguage === 'ar' ? chip.dataset.ar : chip.dataset.en;
        chip.title = currentLabel.textContent;
        photo.alt = currentLabel.textContent;
        if (chip.classList.contains('no-photo')) {
          photo.src = makeFallbackAvatar(currentLabel.textContent);
        }
        renderSidebar();
      }
    });
    pitch.appendChild(chip);
    renderSidebar();
    return chip;
  }

  // ===== السحب والإفلات (يشتغل باللمس والماوس) =====
  function enableDrag(chip){
    let dragging = false, moved = false;

    chip.addEventListener('pointerdown', (e) => {
      if (deleteMode) return;
      dragging = true; moved = false;
      chip.classList.add('dragging');
      chip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    chip.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      moved = true;
      const rect = pitch.getBoundingClientRect();
      let x = ((e.clientX - rect.left) / rect.width) * 100;
      let y = ((e.clientY - rect.top) / rect.height) * 100;
      x = Math.max(2, Math.min(98, x));
      y = Math.max(1.5, Math.min(98.5, y));
      chip.style.left = x + '%';
      chip.style.top = y + '%';
    });

    const stop = () => {
      dragging = false;
      chip.classList.remove('dragging');
    };
    chip.addEventListener('pointerup', stop);
    chip.addEventListener('pointercancel', stop);
  }

  // ===== إضافة لاعب جديد مع صورته =====
  function readImageFile(file){
    if (!file) return Promise.resolve('');
    if (file.size > 5 * 1024 * 1024){
      alert(uiText[currentLanguage].imageTooLarge);
      return Promise.reject(new Error('Image too large'));
    }
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(reader.error || new Error('Unable to read image'));
      reader.readAsDataURL(file);
    });
  }

  function readSelectedImage(){
    const file = playerImageInput && playerImageInput.files ? playerImageInput.files[0] : null;
    return readImageFile(file);
  }

  function resetNewPlayerForm(){
    nameInputAr.value = '';
    nameInputEn.value = '';
    if (playerImageInput) playerImageInput.value = '';
    if (imageFileName) imageFileName.textContent = uiText[currentLanguage].noImage;
    nameInputAr.focus();
  }

  async function addPlayer(isGk){
    const arName = nameInputAr.value.trim();
    const enNameRaw = nameInputEn.value.trim();
    const enName = enNameRaw ? enNameRaw.toUpperCase() : '';

    if (!arName && !enName){
      const preferredInput = currentLanguage === 'en' ? nameInputEn : nameInputAr;
      preferredInput.focus();
      const originalPlaceholder = currentLanguage === 'en' ? uiText[currentLanguage].placeholderEn : uiText[currentLanguage].placeholderAr;
      preferredInput.placeholder = currentLanguage === 'ar' ? '⚠️ اكتبي الاسم أول...' : '⚠️ Enter the name first...';
      setTimeout(() => preferredInput.placeholder = originalPlaceholder, 1600);
      return;
    }

    let imageUrl = '';
    try{
      imageUrl = await readSelectedImage();
    }catch(error){
      return;
    }

    const finalArName = arName || enName;
    const finalEnName = enName || arName.toUpperCase();

    const duplicate = squadRoster.find(player =>
      player.en.toLocaleLowerCase() === finalEnName.toLocaleLowerCase() ||
      player.ar.toLocaleLowerCase() === finalArName.toLocaleLowerCase()
    );

    if (duplicate){
      duplicate.ar = finalArName || duplicate.ar;
      duplicate.en = finalEnName || duplicate.en;
      if (imageUrl){
        duplicate.image = imageUrl;
        const duplicateChip = getChipByRosterId(duplicate.id);
        if (duplicateChip){
          duplicateChip.dataset.image = imageUrl;
          const duplicatePhoto = duplicateChip.querySelector('.player-photo');
          if (duplicatePhoto) duplicatePhoto.src = imageUrl;
        }
      }
      const duplicateChip = addRosterPlayerToPitch(duplicate);
      if (duplicateChip){
        duplicateChip.dataset.ar = duplicate.ar;
        duplicateChip.dataset.en = duplicate.en;
        const duplicateLabel = duplicateChip.querySelector('.player-name');
        if (duplicateLabel) duplicateLabel.textContent = currentLanguage === 'ar' ? duplicate.ar : duplicate.en;
        duplicateChip.title = currentLanguage === 'ar' ? duplicate.ar : duplicate.en;
      }
      resetNewPlayerForm();
      renderSidebar();
      return;
    }

    customPlayerCounter += 1;
    const player = {
      id: `custom-player-${Date.now()}-${customPlayerCounter}`,
      en: finalEnName,
      ar: finalArName,
      image: imageUrl,
      isGk: !!isGk,
      x: 50,
      y: isGk ? 9 : 50
    };
    squadRoster.push(player);
    addRosterPlayerToPitch(player);
    resetNewPlayerForm();
    renderSidebar();
  }

  addBtn.addEventListener('click', () => addPlayer(false));
  addGkBtn.addEventListener('click', () => addPlayer(true));
  [nameInputAr, nameInputEn].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addPlayer(false);
    });
  });
  if (playerImageInput){
    playerImageInput.addEventListener('change', () => {
      const file = playerImageInput.files && playerImageInput.files[0];
      if (imageFileName) imageFileName.textContent = file ? file.name : uiText[currentLanguage].noImage;
    });
  }
  if (updatePlayerImageInput){
    updatePlayerImageInput.addEventListener('change', async () => {
      const file = updatePlayerImageInput.files && updatePlayerImageInput.files[0];
      const player = getRosterPlayer(pendingPhotoPlayerId);
      if (!file || !player){
        pendingPhotoPlayerId = '';
        return;
      }

      try{
        const imageUrl = await readImageFile(file);
        if (!imageUrl) return;
        player.image = imageUrl;

        const chip = getChipByRosterId(player.id);
        if (chip){
          chip.dataset.image = imageUrl;
          chip.classList.remove('no-photo');
          const chipPhoto = chip.querySelector('.player-photo');
          if (chipPhoto){
            chipPhoto.src = imageUrl;
            chipPhoto.alt = currentLanguage === 'ar' ? player.ar : player.en;
          }
        }
        renderSidebar();
      }catch(error){
        // The validation message is already shown by readImageFile.
      }finally{
        pendingPhotoPlayerId = '';
        updatePlayerImageInput.value = '';
      }
    });
  }

  // ===== وضع الحذف =====
  deleteBtn.addEventListener('click', () => {
    deleteMode = !deleteMode;
    document.body.classList.toggle('delete-mode', deleteMode);
    deleteBtn.classList.toggle('on', deleteMode);
    deleteBtn.textContent = deleteMode ? '✅ انتهيت من الحذف' : '🗑️ وضع الحذف';
  });

  // ===== اللغة + الطباعة =====
  function setSiteLanguage(lang){
    currentLanguage = lang;
    const text = uiText[lang];

    document.documentElement.lang = text.htmlLang;
    document.documentElement.dir = text.dir;
    document.body.classList.toggle('lang-ar', lang === 'ar');
    document.body.classList.toggle('lang-en', lang === 'en');
    document.body.classList.toggle('print-ar', lang === 'ar');

    const title = document.querySelector('.top h1');
    const subtitle = document.querySelector('.top p');
    const hint = document.querySelector('.hint');

    if (title) title.textContent = text.title;
    if (subtitle) subtitle.textContent = text.subtitle;
    if (hint) hint.textContent = text.hint;
    if (sidebarTitle) sidebarTitle.textContent = text.sidebarTitle;
    if (playerImageLabel) playerImageLabel.textContent = text.chooseImage;
    if (imageFileName && !(playerImageInput && playerImageInput.files && playerImageInput.files[0])) {
      imageFileName.textContent = text.noImage;
    }

    if (printOptionsTitle) printOptionsTitle.textContent = text.printOptionsTitle;
    if (printNamesLabel) printNamesLabel.textContent = text.printNames;
    if (printImagesLabel) printImagesLabel.textContent = text.printImages;
    if (printPitchLabel) printPitchLabel.textContent = text.printPitchLabel;
    if (printPitchBwOption) printPitchBwOption.textContent = text.printPitchBw;
    if (printPitchGreenOption) printPitchGreenOption.textContent = text.printPitchGreen;

    nameInputAr.placeholder = text.placeholderAr;
    nameInputEn.placeholder = text.placeholderEn;
    addBtn.textContent = text.addPlayer;
    addGkBtn.textContent = text.addGk;
    printBtn.textContent = text.print;
    deleteBtn.textContent = deleteMode ? text.deleteOn : text.deleteOff;

    arabicSiteBtn.classList.toggle('on', lang === 'ar');
    englishSiteBtn.classList.toggle('on', lang === 'en');

    document.querySelectorAll('.chip').forEach(chip => {
      const label = chip.querySelector('.player-name');
      const photo = chip.querySelector('.player-photo');
      const englishName = chip.dataset.en || (label ? label.textContent.trim() : '');
      const arabicName = chip.dataset.ar || arabicNames[englishName] || englishName;
      const shownName = lang === 'ar' ? arabicName : englishName;
      if (label) label.textContent = shownName;
      if (photo) {
        photo.alt = shownName;
        if (chip.classList.contains('no-photo')) photo.src = makeFallbackAvatar(shownName);
      }
      chip.title = shownName;
      chip.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    });

    renderSidebar();
  }

  function printFormation(){
    if (deleteMode) deleteBtn.click();

    const text = uiText[currentLanguage];
    const dateEl = document.getElementById('printDate');
    if (dateEl) {
      dateEl.textContent =
        new Date().toLocaleDateString(text.printLocale, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    }

    const showNames = printShowNames ? printShowNames.checked : true;
    const showImages = printShowImages ? printShowImages.checked : true;
    const pitchStyle = printPitchStyle ? printPitchStyle.value : 'bw';

    document.body.classList.toggle('print-ar', currentLanguage === 'ar');
    document.body.classList.toggle('print-hide-names', !showNames);
    document.body.classList.toggle('print-hide-images', !showImages);
    document.body.classList.toggle('print-green', pitchStyle === 'green');
    document.body.classList.toggle('print-bw', pitchStyle !== 'green');

    window.print();
  }

  arabicSiteBtn.addEventListener('click', () => setSiteLanguage('ar'));
  englishSiteBtn.addEventListener('click', () => setSiteLanguage('en'));
  printBtn.addEventListener('click', printFormation);

  // ===== تحميل التشكيلة الافتراضية عند فتح الموقع =====
  Object.entries(defaultFormation).forEach(([playerName, position]) => {
    const player = squadRoster.find(item => item.en === playerName);
    if (!player) return;
    player.x = position.x;
    player.y = position.y;
    createChip(player.en, player.x, player.y, player.isGk, player.image, player.id, player.ar);
  });
  setSiteLanguage('ar');
})();
